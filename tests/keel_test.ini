# KEEL Test Configuration File
# Used by integration tests with Docker PostgreSQL cluster
# Docker ports: primary=15432, replica1=15433, replica2=15434
# KEEL proxy listens on: 16432

[keel]
log_level = 3  # DEBUG for testing

[worker_group.myapp]
name = test
bind_addr = 127.0.0.1
bind_port = 16432
num_workers = 2
max_conns_per_worker = 100
client_idle_timeout = 30s
client_connect_timeout = 10s

# Pool behavior
min_pool_size = 2
max_pool_size = 10

# Health check
probe = postgres
probe_interval = 2s
probe_timeout = 2s
probe_retries = 2
failover_delay = 5s

# Server auth (Docker PostgreSQL uses postgres/postgres)
server_user = postgres
server_password = postgres

[worker_group.myapp.servers]
# Docker PostgreSQL cluster ports (mapped from containers)
primary  = host=127.0.0.1 port=15432 dbname=postgres role=primary weight=100
replica1 = host=127.0.0.1 port=15433 dbname=postgres role=replica weight=100
replica2 = host=127.0.0.1 port=15434 dbname=postgres role=replica weight=100

# Note: The proxy currently uses hardcoded test/test user for MD5 auth
# Client connects with: user=test password=test

[worker_group.myapp.shard_rule.users]
column      = id
shard_count = 8

[worker_group.myapp.shard_rule.orders]
column      = order_id
shard_count = 4

[worker_group.myapp.shard_rule.tenants]
column      = slug
shard_count = 16

[prometheus]
enabled     = true
listen_addr = 0.0.0.0
port        = 9101
