# KEEL Helm CI Configuration
# Used by the helm-e2e CI job (kind cluster, no real postgres).
# The proxy listeners and admin/metrics endpoints must come up healthy
# even without reachable backends so the startup probe passes.

[keel]
config_version = 2
log_level = 2

[worker_group.ci]
name        = ci
bind_addr   = 0.0.0.0
bind_port   = 7432
num_workers = 2

min_pool_size = 1
max_pool_size = 5

probe         = postgres
probe_interval = 5s
probe_timeout  = 2s
probe_retries  = 1
failover_delay = 5s

server_user     = postgres
server_password = postgres

[worker_group.ci.servers]
# No real backends — probes will mark these DOWN, but the proxy still starts.
primary = host=127.0.0.1 port=5432 dbname=postgres role=primary weight=100

[admin]
enabled      = true
listen_addr  = 0.0.0.0
listen_port  = 6433

[prometheus]
enabled      = true
listen_addr  = 0.0.0.0
port         = 9101
