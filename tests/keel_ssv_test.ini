# KEEL SSV E2E Test Configuration
# Single-worker, single-backend configuration for deterministic stmt replay.

[keel]
log_level = 3

[worker_group.myapp]
name = test
bind_addr = 127.0.0.1
bind_port = 16433
num_workers = 1
worker_strategy = fixed
distribution = round_robin
max_conns_per_worker = 32
max_conns_total = 64
client_idle_timeout = 30s
client_connect_timeout = 10s
buffer_pool_size = 32MB
arena_size = 32KB

pool_mode = transaction
min_pool_size = 1
max_pool_size = 1
idle_timeout = 30s
query_timeout = 30s

probe = postgres
probe_interval = 2s
probe_timeout = 2s
probe_retries = 2
failover_delay = 5s

server_user = postgres
server_password = postgres
server_auth = scram-sha-256
prepared_statement = tracking

[worker_group.myapp.servers]
primary = host=127.0.0.1 port=15432 dbname=postgres role=primary weight=100