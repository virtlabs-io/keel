[pytest]
# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 8.0

# Default options — override on the command line as needed
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=120
    --html=reports/e2e_report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/e2e_report.json
    --json-report-indent=2

# Custom markers (also declared in conftest.py)
markers =
    pool:      connection-pool behaviour tests
    sharding:  shard-routing correctness tests
    scatter:   scatter-merge aggregation tests
    twopc:     two-phase commit tests
    failover:  backend failover and recovery tests
    chaos:     chaos and fault-injection tests (require container operations)
    routing:   routing correctness and distribution balance tests
    integrity: data integrity under concurrent load
    cache:     query result cache correctness and TTL tests
    rw_split:  read/write split routing tests
    metrics:  observability — Prometheus and admin interface
    stress:   load and concurrency tests (slower)
    limitations: known KEEL scatter/sharding limitations (xfail)
    protocol: wire-protocol compliance and fuzzing tests (raw TCP, no libpq)
    streaming: PostgreSQL streaming replication tests (integration)
    patroni:   Patroni HA cluster tests (integration)

# Logging
log_cli       = false
log_level     = WARNING
log_cli_level = WARNING

# Output
console_output_style = progress
