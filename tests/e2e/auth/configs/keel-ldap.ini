# KEEL auth-test — LDAP mode
[keel]
log_level = 3

[worker_group.auth_ldap]
bind_addr = 0.0.0.0
bind_port = 5432
num_workers = 1
max_pool_size = 5
min_pool_size = 1
auth_method = ldap

# LDAP server — openldap service in docker compose
ldap_url = ldap://openldap:389
ldap_base_dn = ou=people,dc=keel,dc=test
ldap_bind_dn = cn=admin,dc=keel,dc=test
ldap_bind_password = adminpass
ldap_search_filter = (uid=%u)
ldap_start_tls = 0
ldap_timeout = 10

# Backend connection
server_user = postgres
server_password = postgrespass

[worker_group.auth_ldap.servers]
primary = host=postgres port=5432 dbname=testdb user=postgres password=postgrespass role=primary weight=100
