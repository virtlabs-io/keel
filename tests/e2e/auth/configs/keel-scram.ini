# KEEL auth-test — SCRAM-SHA-256 mode
[keel]
config_version = 2
log_level = 5

[worker_group.auth_scram]
bind_addr = 0.0.0.0
bind_port = 5432
num_workers = 1
max_pool_size = 5
min_pool_size = 1
auth_method = scram-sha-256
userlist_file = /etc/keel/userlist.txt
server_user = postgres
server_password = postgrespass

[worker_group.auth_scram.servers]
primary = host=postgres port=5432 dbname=testdb user=postgres password=postgrespass role=primary weight=100
