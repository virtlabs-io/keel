# KEEL auth-test — trust mode
[keel]
config_version = 2
log_level = 3

[worker_group.auth_trust]
bind_addr = 0.0.0.0
bind_port = 5432
num_workers = 1
max_pool_size = 5
min_pool_size = 1
auth_method = trust
server_user = postgres
server_password = postgrespass

[worker_group.auth_trust.servers]
primary = host=postgres port=5432 dbname=testdb user=postgres password=postgrespass role=primary weight=100
