# KEEL auth-test — MD5 mode (legacy, for compatibility testing)
[keel]
log_level = 3

[worker_group.auth_md5]
bind_addr = 0.0.0.0
bind_port = 5432
num_workers = 1
max_pool_size = 5
min_pool_size = 1
auth_method = md5
userlist_file = /etc/keel/userlist.txt
server_user = postgres
server_password = postgrespass

[worker_group.auth_md5.servers]
primary = host=postgres port=5432 dbname=testdb user=postgres password=postgrespass role=primary weight=100
