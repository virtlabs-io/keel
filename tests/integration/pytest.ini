[pytest]
# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=600

# Custom markers
markers =
    streaming: PostgreSQL streaming replication tests
    patroni:   Patroni HA cluster tests
    rw_split:  Read/write split routing tests

# Logging
log_cli       = false
log_level     = WARNING

# Output
console_output_style = progress
