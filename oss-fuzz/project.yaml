# OSS-Fuzz project configuration for KEEL
#
# Submitted to: https://github.com/google/oss-fuzz/tree/master/projects/keel
#
# To test locally:
#   git clone https://github.com/google/oss-fuzz
#   cp -r /path/to/keel/oss-fuzz oss-fuzz/projects/keel
#   cd oss-fuzz
#   python infra/helper.py build_image keel
#   python infra/helper.py build_fuzzers keel --sanitizer address
#   python infra/helper.py run_fuzzer keel test_fuzz_harness

homepage: "https://github.com/virtlabs-io/dbcp-keel"
language: c
primary_contact: "security@virtlabs.io"
auto_ccs:
  - "security@virtlabs.io"
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
  - memory
  - undefined
  - coverage
architectures:
  - x86_64
