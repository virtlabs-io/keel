name: package-linux

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    tags:
      - 'alpha-*'
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY != '' }}
      # Pre-release tags (alpha / beta / rc) are allowed to publish unsigned
      # artifacts with a warning; production tags still require a signing key.
      IS_PRERELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || startsWith(github.ref_name, 'alpha-') || startsWith(github.ref_name, 'beta-') || startsWith(github.ref_name, 'rc-')) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version consistency gate ──────────────────────────────────────────
      # Fail fast if the tag semver does not match CMakeLists.txt VERSION.
      # Prevents releasing a binary whose compiled-in version differs from the
      # git tag.  Use scripts/make-release.sh to bump both atomically.
      - name: Verify tag version matches CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          semver="${tag#v}"
          semver="${semver%%-*}"
          if [[ ! "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Non-semver tag '$tag' — skipping version check"
            exit 0
          fi
          cmake_ver=$(grep -oP '(?<=VERSION )\d+\.\d+\.\d+' CMakeLists.txt | head -1)
          if [[ "$semver" != "$cmake_ver" ]]; then
            echo "::error::Tag '$tag' semver '$semver' ≠ CMakeLists.txt VERSION '$cmake_ver'"
            echo "::error::Use scripts/make-release.sh to bump the version before tagging."
            exit 1
          fi
          echo "Version check passed: tag=${tag}  cmake=${cmake_ver}"

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rpm \
            dpkg-dev \
            gnupg \
            libssl-dev \
            liburing-dev \
            lua5.4 \
            liblua5.4-dev \
            python3 \
            python3-dev \
            groff-base

      # ── Pre-release test gate ────────────────────────────────────────────
      # Run the full CTest suite + Python protocol/resilience suites before
      # building any distributable package.  A failing test means no package.
      - name: Configure (test gate build)
        run: |
          cmake -S . -B build-gate \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_STANDARD=23 \
            -DKEEL_ENABLE_TESTS=ON \
            -DKEEL_ENABLE_HARDENING=ON

      - name: Build (test gate)
        run: cmake --build build-gate -j$(nproc)

      - name: Run CTest (test gate)
        run: ctest --test-dir build-gate --output-on-failure -LE integration -j$(nproc)

      - name: Install Python test dependencies
        run: pip3 install --user psycopg2-binary

      - name: Run Python suites (test gate)
        run: |
          python3 tests/run_tests.py \
            --suite protocol \
            --suite resilience \
            --build-dir build-gate \
            --ci

      # ── Build distributable packages ─────────────────────────────────────
      - name: Build Linux packages
        run: bash scripts/package-linux.sh

      - name: Generate CycloneDX SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/packages/keel-${{ github.ref_name }}-sbom.cdx.json

      - name: Import GPG key for package signing
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true'
        env:
          PACKAGE_SIGNING_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$PACKAGE_SIGNING_PRIVATE_KEY" | gpg --batch --import

      - name: Sign release artifacts
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true'
        env:
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(artifacts/packages/*.deb artifacts/packages/*.rpm artifacts/packages/*.tar.gz artifacts/packages/*.cdx.json)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No artifacts found to sign" >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" > artifacts/packages/SHA256SUMS
          passphrase_args=()
          if [[ -n "${PACKAGE_SIGNING_PASSPHRASE:-}" ]]; then
            passphrase_args=(--pinentry-mode loopback --passphrase "$PACKAGE_SIGNING_PASSPHRASE")
          fi
          for f in "${artifacts[@]}" artifacts/packages/SHA256SUMS; do
            gpg --batch --yes "${passphrase_args[@]}" --armor --detach-sign "$f"
          done

      - name: Fail when signing is not configured for a tagged release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY != 'true' && env.IS_PRERELEASE_TAG != 'true'
        run: |
          echo "::error::PACKAGE_SIGNING_PRIVATE_KEY secret is not configured." >&2
          echo "::error::Production tagged releases must publish signed artifacts; refusing to continue." >&2
          echo "::error::Configure the PACKAGE_SIGNING_PRIVATE_KEY (and optionally PACKAGE_SIGNING_PASSPHRASE) repository secret, or delete the tag." >&2
          exit 1

      - name: Warn when signing is not configured (pre-release tag)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY != 'true' && env.IS_PRERELEASE_TAG == 'true'
        run: |
          echo "::warning::PACKAGE_SIGNING_PRIVATE_KEY not configured; pre-release tag ${{ github.ref_name }} will publish UNSIGNED artifacts." >&2
          echo "::warning::Configure the secret before tagging a production release." >&2

      - name: Warn when signing is not configured (non-tag build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY != 'true' }}
        run: echo "PACKAGE_SIGNING_PRIVATE_KEY secret not configured; non-tag build will produce unsigned artifacts."

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keel-linux-packages
          path: artifacts/packages/*

      - name: Publish GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            artifacts/packages/keel_*.deb
            artifacts/packages/keel-*.rpm
            artifacts/packages/keel-*-Linux-*.tar.gz
            artifacts/packages/keel-*.cdx.json
          )
          if [[ "${HAS_SIGNING_KEY}" == "true" ]]; then
            files+=(artifacts/packages/*.asc artifacts/packages/SHA256SUMS)
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No package artifacts found to upload" >&2
            exit 1
          fi
          # Immutable-releases policy: assets can only be attached at creation
          # time. If a release for this tag already exists (e.g. a prior failed
          # run), delete it first so we can re-create it with the assets
          # attached atomically. The tag itself is preserved (--cleanup-tag=false).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false
          fi
          prerelease_flag=()
          if [[ "${IS_PRERELEASE_TAG}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            "${prerelease_flag[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated Linux package assets for $GITHUB_REF_NAME" \
            "${files[@]}"
