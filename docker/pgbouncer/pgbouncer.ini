[databases]
testdb = host=pgsql-01 port=5432 dbname=testdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
pidfile = /tmp/pgbouncer.pid
logfile = /tmp/pgbouncer.log
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 80
min_pool_size = 40
max_client_conn = 5000

; --- Performance tuning ---------------------------------------------------
; Skip per-transaction DISCARD ALL (saves 1 RT per txn switch).
; Keel also does not reset server state between transactions.
server_reset_query =
server_check_query = SELECT 1
server_check_delay = 30
server_fast_close = 1
server_lifetime = 3600
server_idle_timeout = 300
server_connect_timeout = 10

; --- Networking -----------------------------------------------------------
tcp_defer_accept = 45
tcp_keepalive = 1
tcp_keepidle = 600
tcp_keepintvl = 60
tcp_keepcnt = 5
so_reuseport = 1

; --- Logging (minimal for benchmarks) ------------------------------------
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
unix_socket_dir = 
