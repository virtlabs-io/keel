# =============================================================================
# KEEL Multi-Proxy HA Cluster — Production Compose Template (PG)
# =============================================================================
# Uses the published keel image from ghcr.io instead of a local build.
# Config is supplied entirely via KEEL_* environment variables — no INI
# volume mount is required for cluster settings.
#
# Architecture:
#   Client ──► keel-1 (7432) ──┐
#   Client ──► keel-2 (7433) ──┤──► pgsql-01 (primary  RW 5432)
#   Client ──► keel-3 (7434) ──┘──► pgsql-02 (replica  RO 5432)
#                                └──► pgsql-03 (replica  RO 5432)
#
# Each KEEL node:
#   SQL proxy    → host:7432 / 7433 / 7434
#   Admin        → host:6433 / 6434 / 6435   (psql -h 127.0.0.1 -p 6433 -U admin keel)
#   Prometheus   → host:9101 / 9102 / 9103   (http://127.0.0.1:9101/metrics)
#   Cluster peer → 9100 (internal only)
#
# Usage:
#   # Pull latest image
#   docker pull ghcr.io/virtlabs/keel:latest
#
#   # Start the full stack
#   docker compose -f docker/compose/pg-ha-official.yml up -d
#
#   # Connect via any keel node
#   psql -h 127.0.0.1 -p 7432 -U postgres postgres
#   psql -h 127.0.0.1 -p 7433 -U postgres postgres
#
#   # Check cluster status
#   psql -h 127.0.0.1 -p 6433 -U admin keel -c "SHOW CLUSTER;"
#   psql -h 127.0.0.1 -p 6433 -U admin keel -c "SHOW CLUSTER STATS;"
#
# Override the image tag:
#   KEEL_IMAGE=ghcr.io/virtlabs/keel:1.2.0 \
#   docker compose -f docker/compose/pg-ha-official.yml up -d
# =============================================================================

name: keel-pg-ha

x-keel-base: &keel-base
  image: ${KEEL_IMAGE:-ghcr.io/virtlabs/keel:latest}
  restart: unless-stopped
  networks:
    - cluster
  depends_on:
    pgsql-01:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "nc", "-z", "127.0.0.1", "6433"]
    interval: 10s
    timeout: 3s
    start_period: 15s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 512M

x-keel-env-common: &keel-env-common
  # Backend servers — adjust user/password/db for your environment
  KEEL_LOG_LEVEL: info
  KEEL_ADMIN_ENABLED: "true"
  KEEL_ADMIN_PORT: "6433"
  KEEL_PROM_ENABLED: "true"
  KEEL_PROM_PORT: "9101"
  KEEL_CLUSTER_ENABLED: "true"
  KEEL_CLUSTER_LISTEN_PORT: "9100"
  KEEL_CLUSTER_HB_INTERVAL: "1000"
  KEEL_CLUSTER_HB_TIMEOUT: "5000"
  KEEL_CLUSTER_FAIL_THRESHOLD: "3"
  KEEL_CLUSTER_AUTO_SYNC: "true"

services:

  # ==========================================================================
  # PostgreSQL — Primary (RW)
  # ==========================================================================
  pgsql-01:
    image: postgres:17-alpine
    container_name: keel-pg-ha-pgsql-01
    hostname: pgsql-01
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgsql_01_data:/var/lib/postgresql/data
      - ../postgres/scripts/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - ../postgres/config/postgresql-overrides.conf:/etc/postgresql/conf.d/postgresql-overrides.conf:ro
    networks:
      - cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 1gb

  # ==========================================================================
  # PostgreSQL — Replica 1 (RO)
  # ==========================================================================
  pgsql-02:
    image: postgres:17-alpine
    container_name: keel-pg-ha-pgsql-02
    hostname: pgsql-02
    restart: unless-stopped
    user: postgres
    entrypoint: []
    command: >
      bash -c "
        until pg_isready -h pgsql-01 -U postgres; do sleep 1; done
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h pgsql-01 -U repl_user -D /var/lib/postgresql/data -Fp -Xs -R -P
        exec postgres
      "
    volumes:
      - pgsql_02_data:/var/lib/postgresql/data
    depends_on:
      pgsql-01:
        condition: service_healthy
    networks:
      - cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    shm_size: 1gb

  # ==========================================================================
  # PostgreSQL — Replica 2 (RO)
  # ==========================================================================
  pgsql-03:
    image: postgres:17-alpine
    container_name: keel-pg-ha-pgsql-03
    hostname: pgsql-03
    restart: unless-stopped
    user: postgres
    entrypoint: []
    command: >
      bash -c "
        until pg_isready -h pgsql-01 -U postgres; do sleep 1; done
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h pgsql-01 -U repl_user -D /var/lib/postgresql/data -Fp -Xs -R -P
        exec postgres
      "
    volumes:
      - pgsql_03_data:/var/lib/postgresql/data
    depends_on:
      pgsql-01:
        condition: service_healthy
    networks:
      - cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    shm_size: 1gb

  # ==========================================================================
  # KEEL Node 1
  # ==========================================================================
  keel-1:
    <<: *keel-base
    container_name: keel-pg-ha-node-1
    hostname: keel-1
    volumes:
      - ../keel/keel-cluster.ini:/etc/keel/keel.ini:ro
    environment:
      <<: *keel-env-common
      KEEL_CLUSTER_NODE_ID: keel-1
      KEEL_CLUSTER_INITIAL_PEERS: "keel-2:9100,keel-3:9100"
    ports:
      - "${KEEL1_SQL_PORT:-7432}:7432"
      - "${KEEL1_ADMIN_PORT:-6433}:6433"
      - "${KEEL1_PROM_PORT:-9101}:9101"
    depends_on:
      pgsql-01:
        condition: service_healthy
      pgsql-02:
        condition: service_healthy
      pgsql-03:
        condition: service_healthy

  # ==========================================================================
  # KEEL Node 2
  # ==========================================================================
  keel-2:
    <<: *keel-base
    container_name: keel-pg-ha-node-2
    hostname: keel-2
    volumes:
      - ../keel/keel-cluster.ini:/etc/keel/keel.ini:ro
    environment:
      <<: *keel-env-common
      KEEL_CLUSTER_NODE_ID: keel-2
      KEEL_CLUSTER_INITIAL_PEERS: "keel-1:9100,keel-3:9100"
    ports:
      - "${KEEL2_SQL_PORT:-7433}:7432"
      - "${KEEL2_ADMIN_PORT:-6434}:6433"
      - "${KEEL2_PROM_PORT:-9102}:9101"
    depends_on:
      pgsql-01:
        condition: service_healthy
      pgsql-02:
        condition: service_healthy
      pgsql-03:
        condition: service_healthy

  # ==========================================================================
  # KEEL Node 3
  # ==========================================================================
  keel-3:
    <<: *keel-base
    container_name: keel-pg-ha-node-3
    hostname: keel-3
    volumes:
      - ../keel/keel-cluster.ini:/etc/keel/keel.ini:ro
    environment:
      <<: *keel-env-common
      KEEL_CLUSTER_NODE_ID: keel-3
      KEEL_CLUSTER_INITIAL_PEERS: "keel-1:9100,keel-2:9100"
    ports:
      - "${KEEL3_SQL_PORT:-7434}:7432"
      - "${KEEL3_ADMIN_PORT:-6435}:6433"
      - "${KEEL3_PROM_PORT:-9103}:9101"
    depends_on:
      pgsql-01:
        condition: service_healthy
      pgsql-02:
        condition: service_healthy
      pgsql-03:
        condition: service_healthy

networks:
  cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  pgsql_01_data:
  pgsql_02_data:
  pgsql_03_data:
