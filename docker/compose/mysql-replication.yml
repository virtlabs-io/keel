# MySQL 9 Streaming Replication Cluster
# 1 Primary + 2 Replicas (async GTID-based replication)
#
# Ports:
#   primary:  3306
#   replica1: 3307
#   replica2: 3308

name: keel-mysql-replication

services:
  # ==========================================================================
  # Primary MySQL
  # ==========================================================================
  mysql-primary:
    image: mysql:9
    container_name: mysql-rep-primary
    hostname: mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: keel
      MYSQL_PASSWORD: keel
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ../mysql/config/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ../mysql/scripts/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - ../mysql/scripts/init-primary.sql:/docker-entrypoint-initdb.d/init-primary.sql:ro
    ports:
      - "3306:3306"
    networks:
      - mysql-cluster
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # Replica 1
  # ==========================================================================
  mysql-replica1:
    image: mysql:9
    container_name: mysql-rep-replica1
    hostname: mysql-replica1
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_replica1_data:/var/lib/mysql
      - ../mysql/config/replica1.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ../mysql/scripts/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    ports:
      - "3307:3306"
    networks:
      - mysql-cluster
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==========================================================================
  # Replica 2
  # ==========================================================================
  mysql-replica2:
    image: mysql:9
    container_name: mysql-rep-replica2
    hostname: mysql-replica2
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_replica2_data:/var/lib/mysql
      - ../mysql/config/replica2.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ../mysql/scripts/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    ports:
      - "3308:3306"
    networks:
      - mysql-cluster
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  mysql-cluster:
    driver: bridge

volumes:
  mysql_primary_data:
  mysql_replica1_data:
  mysql_replica2_data:
