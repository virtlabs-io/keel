# HAProxy configuration for PostgreSQL benchmarking
# L4 (TCP) proxy — comparable to keel in pass-through mode
#
# Optimised for maximum TCP proxy throughput:
#   - splice-auto: zero-copy kernel splice(2) for data forwarding
#   - TCP keepalive on both sides
#   - dontlog-normal: skip logging healthy connections

global
    maxconn 10000
    nbthread 4
    log stdout format raw local0
    tune.bufsize 32768

defaults
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    option tcplog
    option dontlog-normal
    option splice-auto
    option clitcpka
    option srvtcpka

# ============================================================================
# PostgreSQL — single primary (port 7433)
# Comparable to keel proxy benchmarks on port 7432
# ============================================================================
frontend pg_frontend
    bind *:5432
    default_backend pgsql-01

backend pgsql-01
    balance roundrobin
    option pgsql-check user usr_test
    server pgsql-01 pgsql-01:5432 check inter 3s fall 3 rise 2 maxconn 5000

# ============================================================================
# Stats interface (port 8404)
# ============================================================================
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
