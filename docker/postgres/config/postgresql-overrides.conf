# =============================================================================
# DBP Test Environment — PostgreSQL Configuration Overrides
# =============================================================================
#
# This file is included at the end of postgresql.conf via:
#   include_if_exists = '/etc/postgresql/conf.d/postgresql-overrides.conf'
#
# Only parameters listed here are changed; everything else keeps the
# PostgreSQL defaults. Edit freely — no need to touch the base config.
# =============================================================================

# -----------------------------------------------------------------------------
# Connections
# -----------------------------------------------------------------------------
max_connections = 1000

# Use anonymous mmap instead of POSIX shm (/dev/shm).
# Docker containers default to 64 MB /dev/shm which is exhausted by hundreds
# of concurrent backends each allocating DSM segments.  'mmap' writes to
# a temp file instead and is not limited by /dev/shm size.
dynamic_shared_memory_type = mmap

# -----------------------------------------------------------------------------
# Two-phase commit
# -----------------------------------------------------------------------------
# Required for PREPARE TRANSACTION / COMMIT PREPARED / ROLLBACK PREPARED.
# Set to 0 to disable 2PC (the PostgreSQL default).  The scatter-2PC
# integration tests skip gracefully when this is 0 and log an advisory
# message pointing here.
max_prepared_transactions = 10

# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
shared_buffers = 1024MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 3GB

# -----------------------------------------------------------------------------
# WAL / Checkpoints
# -----------------------------------------------------------------------------
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB
wal_buffers = 16MB

# -----------------------------------------------------------------------------
# Replication
# -----------------------------------------------------------------------------
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
wal_keep_size = 256
# With hot_standby_feedback = on the primary defers VACUUM of rows still
# needed by replica snapshots.  Setting -1 (wait forever) prevents the
# replica from ever killing queries due to recovery conflicts — safe because
# the feedback loop ensures the primary won't vacuum those rows anyway.
max_standby_streaming_delay = -1

# -----------------------------------------------------------------------------
# Logging (keep quiet for benchmarks)
# -----------------------------------------------------------------------------
log_statement = none
log_min_duration_statement = 1000
log_checkpoints = on

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
