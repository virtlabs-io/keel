# =============================================================================
# KEEL — Torture-Suite Configuration
# =============================================================================
#
# Single-backend pool.  No sharding, no scatter-merge.
# The torture suite exercises wire-protocol and driver compatibility,
# not sharding logic.
#
# Backend: postgres service defined in docker/compose/pg-torture.yml
# Proxy listens on 0.0.0.0:7432 (container-internal)
# =============================================================================

[keel]
config_version = 2
log_level      = 2

[logging]
log_level = info

# ---------------------------------------------------------------------------
# Prometheus metrics
# ---------------------------------------------------------------------------
[prometheus]
enabled      = true
listen_addr  = 0.0.0.0
port         = 9101

# ---------------------------------------------------------------------------
# Admin SQL interface  (psql -h keel -p 6433)
# ---------------------------------------------------------------------------
[admin]
enabled      = true
listen_addr  = 0.0.0.0
listen_port  = 6433

# ---------------------------------------------------------------------------
# Proxy pool — transaction mode with prepared-statement virtualisation
# ---------------------------------------------------------------------------
[worker_group.torture]
bind_addr                = 0.0.0.0
bind_port                = 7432
num_workers              = 4
max_client_conns         = 600
min_pool_size            = 5
max_pool_size            = 80
pool_mode                = transaction
mode                     = smart
prepared_statement       = virtualize
auth_method              = trust
query_routing            = off
probe                    = postgres
probe_interval           = 2000
probe_timeout            = 2000
probe_retries            = 1
connect_timeout       = 10000
pool_refill_interval  = 200

[worker_group.torture.servers]
primary = host=postgres port=5432 dbname=postgres user=postgres password=postgres role=RW weight=100
