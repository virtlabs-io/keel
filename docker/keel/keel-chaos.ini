[keel]
config_version = 2
log_level = 2
shutdown_timeout = 15000

[worker_group.chaos]
protocol = postgres
bind_addr = 0.0.0.0
bind_port = 6432
num_workers = 2
auth_method = trust
min_pool_size = 5
max_pool_size = 20
pool_max_waiting = 50
idle_timeout = 30000
connect_timeout = 3000
server_user = postgres
server_password = postgres
probe = postgres
probe_interval = 2s
probe_timeout = 2s
probe_retries = 2
failover_delay = 5s

[worker_group.chaos.servers]
primary  = host=pgsql-primary  port=5432 dbname=chaosdb role=RW weight=100
replica1 = host=pgsql-replica1 port=5432 dbname=chaosdb role=RO weight=50
replica2 = host=pgsql-replica2 port=5432 dbname=chaosdb role=RO weight=50

[admin]
enabled = true
listen_addr = 0.0.0.0
listen_port = 6433

[prometheus]
enabled = true
port = 9101

[logging]
query_log_mode = all
