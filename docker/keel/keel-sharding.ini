# =============================================================================
# KEEL Sharding Integration Test Configuration
# =============================================================================
# Two-shard PostgreSQL setup:
#   shard0 — serves users/orders with id % 2 == 0
#   shard1 — serves users/orders with id % 2 == 1
#
# Also validates:
#   - Hot-reload of shard rules via SIGHUP
#   - Prometheus /metrics endpoint includes router counters
# =============================================================================

[keel]
config_version = 1
log_level = 2

# =============================================================================
# Prometheus metrics
# =============================================================================
[prometheus]
enabled   = true
listen_addr = 0.0.0.0
port      = 9101

# =============================================================================
# Worker Group
# =============================================================================
[worker_group.shardtest]
bind_addr = 0.0.0.0
bind_port = 6432
num_workers = 2
max_client_conns = 100
min_pool_size = 2
max_pool_size = 20
pool_mode = transaction
auth_method = trust
query_routing = on

[worker_group.shardtest.probe]
type     = postgres
interval = 5
timeout  = 3
query    = SELECT 1

[worker_group.shardtest.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100 shard_id=0
shard1 = host=pg-shard1 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100 shard_id=1

# =============================================================================
# Shard rules — hash by primary key
# =============================================================================
[worker_group.shardtest.shard_rule.users]
column      = id
shard_count = 2
strategy    = hash

[worker_group.shardtest.shard_rule.orders]
column      = order_id
shard_count = 2
strategy    = hash
