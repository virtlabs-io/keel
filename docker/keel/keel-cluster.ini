# =============================================================================
# KEEL — Cluster Config for Node 1 (Docker Compose multi-proxy HA)
#
# Three-node KEEL cluster fronting a PostgreSQL streaming replication setup.
# Each node proxies the same backend pool but participates in peer heartbeats
# for failure detection and server topology propagation.
#
# Override per-node settings via KEEL_* environment variables.
# =============================================================================

[keel]
log_level = 2

[worker_group.pg_ha]
protocol        = postgres
bind_addr       = 0.0.0.0
bind_port       = 7432
num_workers     = 4
pool_mode       = transaction
min_pool_size   = 10
max_pool_size   = 50
connect_timeout_ms = 5000
idle_timeout    = 300000
auth_method     = trust

[worker_group.pg_ha.servers]
primary  = host=pgsql-01 port=5432 user=postgres password=postgres dbname=postgres role=RW weight=100
replica1 = host=pgsql-02 port=5432 user=postgres password=postgres dbname=postgres role=RO weight=50
replica2 = host=pgsql-03 port=5432 user=postgres password=postgres dbname=postgres role=RO weight=50

[admin]
enabled     = true
listen_addr = 0.0.0.0
listen_port = 6433
users       = admin

[prometheus]
enabled     = true
listen_addr = 0.0.0.0
port        = 9101

[cluster]
enabled               = false
