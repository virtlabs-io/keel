# =============================================================================
# KEEL End-to-End Test Configuration
# =============================================================================
# PostgreSQL cluster with 3 nodes (1 primary, 2 replicas)
# - 50 connections to backend (pool)
# - 1000 connections from frontend (clients)
# - Port 6432
# =============================================================================

[keel]
# Configuration file format version
config_version = 1

# Log level: 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG
log_level = 2

# =============================================================================
# Worker Group: myapp (default worker group name)
# =============================================================================
[worker_group.myapp]

# Listen configuration
bind_addr = 0.0.0.0
bind_port = 6432

# Number of worker threads (auto-detect based on CPU cores)
num_workers = 4

# Frontend connection limits (accepting 1000 connections)
max_client_conns = 1000

# Backend connection pool settings (50 connections total)
# Split across workers: 50 / 4 workers = ~12-13 per worker
max_conns_per_worker = 15
max_conns_total = 50

# Pool mode: session, transaction, statement
pool_mode = transaction

# Connection timeouts
client_idle_timeout = 300s
server_idle_timeout = 60s
server_connect_timeout = 10s

# Query timeout (0 = no timeout)
query_timeout = 0

# Enable query routing based on SQL analysis
# Disabled for e2e stress test: pgbench TPC-B mixes reads/writes in a single
# transaction; routing the SELECT to a replica mid-transaction breaks the txn.
query_routing = off

# Authentication - use trust for E2E testing simplicity
auth_method = trust

# =============================================================================
# Client Authentication Settings  (note: auth is configured per worker_group)
# =============================================================================
# auth_method = trust|md5|scram-sha-256  is set in [worker_group.<name>]

# =============================================================================
# Health Probe Configuration
# =============================================================================
[worker_group.myapp.probe]
type = postgres
interval = 5
timeout = 3
query = SELECT 1

# =============================================================================
# Backend Servers
# =============================================================================
[worker_group.myapp.servers]

# Primary (read-write)
primary = host=pgsql-01 port=5432 dbname=testdb role=RW weight=100

# Replica 1 — read-only (streaming replica, PostgreSQL rejects writes on standby)
replica1 = host=pgsql-02 port=5432 dbname=testdb role=RO weight=50

# Replica 2 — read-only (streaming replica, PostgreSQL rejects writes on standby)
replica2 = host=pgsql-03 port=5432 dbname=testdb role=RO weight=50
