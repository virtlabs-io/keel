# =============================================================================
# KEEL — E2E Test Suite Configuration
# =============================================================================
#
# Two-shard PostgreSQL setup used by tests/e2e/
#
#   pg-shard0   shard_id=0  (even hash bucket)
#   pg-shard1   shard_id=1  (odd  hash bucket)
#
# Features exercised:
#   - Connection pooling (transaction mode)
#   - Hash-based shard routing for users, orders, events
#   - Scatter-merge for cross-shard aggregation queries
#   - Two-phase commit on scatter writes
#   - Prometheus /metrics observability
#   - Admin SQL interface
# =============================================================================

[keel]
config_version        = 2
log_level             = 2
experimental_features = true

[logging]
log_level = info

# ---------------------------------------------------------------------------
# Prometheus metrics
# ---------------------------------------------------------------------------
[prometheus]
enabled      = true
listen_addr  = 0.0.0.0
port         = 9101

# ---------------------------------------------------------------------------
# Admin SQL interface (connect with psql -p 6433)
# ---------------------------------------------------------------------------
[admin]
enabled      = true
listen_addr  = 0.0.0.0
listen_port  = 6433

# ---------------------------------------------------------------------------
# Worker group: proxy port 6432
# ---------------------------------------------------------------------------
[worker_group.e2e]
bind_addr              = 0.0.0.0
bind_port              = 6432
num_workers            = 4
max_client_conns       = 400
min_pool_size          = 2
max_pool_size          = 60
pool_mode              = transaction
auth_method            = trust
query_routing          = on
probe                  = postgres
probe_interval         = 2000
probe_timeout          = 2000
probe_retries          = 1
connect_timeout     = 10000
pool_refill_interval = 500
result_cache            = on

[worker_group.e2e.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100 shard_id=0
shard1 = host=pg-shard1 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100 shard_id=1

# ---------------------------------------------------------------------------
# Shard routing rules
# ---------------------------------------------------------------------------
[worker_group.e2e.shard_rule.users]
column      = id
shard_count = 2
strategy    = hash

[worker_group.e2e.shard_rule.orders]
column      = order_id
shard_count = 2
strategy    = hash

[worker_group.e2e.shard_rule.events]
column      = shard_hint
shard_count = 2
strategy    = hash

[worker_group.e2e.shard_rule.keel_2pc_test]
column      = shard
shard_count = 2
strategy    = hash

[worker_group.e2e.shard_rule.products]
column      = product_id
shard_count = 2
strategy    = hash

[worker_group.e2e.shard_rule.user_activity]
column      = user_id
shard_count = 2
strategy    = hash

# ===========================================================================
# Prepared Statement pooling test worker groups
# Each group points at pg-shard0 only (no sharding rules) and uses a distinct
# prepared_statement mode.  Host ports 26440-26444 map to container ports
# 6440-6444.  Tests use these ports via the ps_*_dsn fixtures.
# ===========================================================================

# ---------------------------------------------------------------------------
# PS virtualize — default intercept-and-replay strategy (port 6440)
# ---------------------------------------------------------------------------
[worker_group.ps_virtualize]
bind_addr              = 0.0.0.0
bind_port              = 6440
num_workers            = 2
max_client_conns       = 80
min_pool_size          = 1
max_pool_size          = 4
pool_mode              = transaction
auth_method            = trust
prepared_statement     = virtualize
connect_timeout     = 10000

[worker_group.ps_virtualize.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100

# ---------------------------------------------------------------------------
# PS pinning — hard-pin backend on first named Parse (port 6441)
# ---------------------------------------------------------------------------
[worker_group.ps_pinning]
bind_addr              = 0.0.0.0
bind_port              = 6441
num_workers            = 2
max_client_conns       = 80
min_pool_size          = 1
max_pool_size          = 4
pool_mode              = transaction
auth_method            = trust
prepared_statement     = pinning
connect_timeout     = 10000

[worker_group.ps_pinning.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100

# ---------------------------------------------------------------------------
# PS tracking — virtualize + simple-query PREPARE interception (port 6442)
# ---------------------------------------------------------------------------
[worker_group.ps_tracking]
bind_addr              = 0.0.0.0
bind_port              = 6442
num_workers            = 2
max_client_conns       = 80
min_pool_size          = 1
max_pool_size          = 4
pool_mode              = transaction
auth_method            = trust
prepared_statement     = tracking
connect_timeout     = 10000

[worker_group.ps_tracking.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100

# ---------------------------------------------------------------------------
# PS anonymous — rewrite named Parse to anonymous on backend (port 6443)
# ---------------------------------------------------------------------------
[worker_group.ps_anonymous]
bind_addr              = 0.0.0.0
bind_port              = 6443
num_workers            = 2
max_client_conns       = 80
min_pool_size          = 1
max_pool_size          = 4
pool_mode              = transaction
auth_method            = trust
prepared_statement     = anonymous
connect_timeout     = 10000

[worker_group.ps_anonymous.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100

# ---------------------------------------------------------------------------
# PS off — forward Parse to backend verbatim, hard-pin (port 6444)
# ---------------------------------------------------------------------------
[worker_group.ps_off]
bind_addr              = 0.0.0.0
bind_port              = 6444
num_workers            = 2
max_client_conns       = 80
min_pool_size          = 1
max_pool_size          = 4
pool_mode              = transaction
auth_method            = trust
prepared_statement     = off
connect_timeout     = 10000

[worker_group.ps_off.servers]
shard0 = host=pg-shard0 port=5432 dbname=testdb user=postgres password=postgres role=RW weight=100
