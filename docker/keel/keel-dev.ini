# =============================================================================
# KEEL — Dev / Docker configuration
#
# Used inside the keel-devenv container (docker/compose/pg-dev.yml).
# PostgreSQL is reachable at hostname "postgres" on port 5432.
#
# Proxy listens on 0.0.0.0:7432 inside the container.
# From macOS host access via: psql -h 127.0.0.1 -p 7432 ...
# (requires --publish 7432:7432 in the compose file or docker run)
# =============================================================================

[keel]
config_version = 2
log_level = 2

[worker_group.dev_pgsql]
protocol       = postgres
bind_addr      = 0.0.0.0
bind_port      = 7432
num_workers    = 4
pool_mode      = transaction
min_pool_size  = 20
max_pool_size  = 50
connect_timeout = 30000
idle_timeout   = 300000

[worker_group.dev_pgsql.servers]
primary = host=postgres port=5432 user=postgres password=postgres dbname=postgres role=RW weight=100

[users]
postgres = password=postgres auth=trust
sbtest   = password=sbtest   auth=trust
