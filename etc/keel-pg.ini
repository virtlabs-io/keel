# KEEL Configuration File — PostgreSQL Test Environments
# Database Connection Pooler Configuration
# ============================================================================
#
# PostgreSQL-focused configuration for KEEL connection pooler.
# Copy this file and customize for your environment.
#
# ============================================================================
# AUTHENTICATION OVERVIEW
# ============================================================================
#
# KEEL has TWO authentication contexts:
#
# 1. CLIENT AUTHENTICATION (how clients authenticate to KEEL)
#    - Configured in [auth] section
#    - Credentials stored in [users] section or auth_file
#    - Clients prove their identity to the proxy
#
# 2. SERVER AUTHENTICATION (how KEEL authenticates to backend databases)
#    - Configured per-server in [worker_group.<name>.servers] section
#    - Each backend server can have different credentials
#    - KEEL uses these credentials to establish backend connections
#
# Typical flow:
#   Client --[SCRAM-SHA-256]--> KEEL --[SCRAM-SHA-256]--> PostgreSQL
#          (user: app)              (user: app_backend)
#
# ============================================================================

# ============================================================================
# General Settings
# ============================================================================
[keel]
# Logging: 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=TRACE
config_version = 2
log_level = 2

# Log file path (optional, logs to stdout/stderr if not set)
# log_file = /var/log/keel/keel.log

# Unix socket directory (optional, for local connections)
# unix_socket_dir = /var/run/keel

# PID file location
# pid_file = /var/run/keel/keel.pid

# ============================================================================
# Worker Groups Configuration
# ============================================================================
# Worker groups provide isolated thread pools for handling connections.
# Each group has its own port, buffer pool, backend servers, and limits.
#
# Worker Group Options:
#   name                    - Group name for logging/monitoring
#   bind_addr               - Address to bind (default: 0.0.0.0)
#   bind_port               - Port to listen on
#   num_workers             - Number of worker threads (0 = one per CPU core)
#   max_conns_per_worker    - Max client connections per worker thread
#   client_idle_timeout     - Idle client timeout (default: 5m)
#   client_connect_timeout  - Connection establishment timeout (default: 10s)
#
# Probe Options (health checking and failover):
#   probe                   - Probe type: postgres, patroni:<port>, mysql, mariadb,
#                             maxscale:<port>, tcp, exec:/path/to/script
#   probe_interval          - How often to check (default: 5s)
#   probe_timeout           - Probe timeout (default: 3s)
#   probe_retries           - Failures before marking down (default: 3)
#   failover_delay          - Delay before re-routing (default: 10s)
#
# Size units: B, KB, MB, GB
# Time units: s (seconds), m (minutes), h (hours)
#
# Backend Server Options (in [worker_group.<name>.servers]):
#   host     - Database server hostname (required)
#   port     - Database server port (default: 5432 for postgres, 3306 for mysql)
#   dbname   - Target database name (required)
#   role     - primary, replica, or auto (probe will detect)
#   weight   - Load balancing weight (higher = more traffic)
#
# Server Authentication Options:
#   user     - Username for backend connection (required)
#   password - Password for backend connection (see password options below)
#   auth     - Backend auth method: scram-sha-256, md5, trust, cert
#
# Password Options:
#   password = secret                    # Plain text (not recommended)
#   password = env:MY_DB_PASSWORD        # Read from environment variable
#   password = file:/etc/keel/db.passwd   # Read from file (first line)
#   password = vault:secret/db/password  # Read from HashiCorp Vault
#
# TLS Options (for backend connections):
#   sslmode  - disable, allow, prefer, require, verify-ca, verify-full
#   sslcert  - Client certificate file
#   sslkey   - Client key file
#   sslrootcert - CA certificate file

# Example: Primary database with 1 primary + 2 replicas
[worker_group.test_cluster]
name = test_cluster
protocol = postgres
bind_addr = 0.0.0.0
bind_port = 7432
num_workers = 2 
max_conns_per_worker = 5000
client_idle_timeout = 5m
client_connect_timeout = 10s

# Pool behavior
min_pool_size = 30
max_pool_size = 80

# Prepared-statement pooling strategy
#   virtualize  (default) — spec §17 replay: shadow named PS in session,
#               replay Parse messages to new backends on demand.
#               Best balance of poolability and compatibility.
#   pinning     — hard-pin the backend on first PREPARE; release only on
#               DEALLOCATE ALL / DISCARD ALL or disconnect.  Zero overhead
#               at Execute time but one backend per PS-using session.
#   tracking    — like virtualize but also intercepts Simple Query
#               PREPARE … AS … syntax for full protocol coverage.
#   anonymous   — intercept extended-protocol Parse, suppress to backend,
#               synthesise ParseComplete; JIT-rewrite Bind into a one-shot
#               anonymous Parse+Bind pair.  Backends stay perfectly clean.
# prepared_statement = virtualize

# Probe configuration (health checking and failover)
# Built-in probes: postgres, patroni, mysql, mariadb, tcp
# Format: probe = <type>[:<port>] or probe = custom:<name>
probe = postgres
probe_interval = 5s
probe_timeout = 3s
probe_retries = 3
failover_delay = 10s

# Default server authentication (applies to all servers unless overridden)
# These credentials are used by KEEL to connect to backend databases
server_user = postgres
server_password = postgres
# server_sslmode = prefer

# Auto-generate TLS certificates on startup (0=off, 1=on).
# When enabled and no tls_cert_file/key_file are set, Keel generates a
# self-signed CA + server/client certs in tls_auto_dir.  Existing certs
# in that directory are reused (the CA key is preserved).
# tls_auto_generate = 1
# tls_auto_dir = /var/lib/keel/certs

[worker_group.test_cluster.servers]
# Servers are monitored for health and role changes.
# The 'role' is the EXPECTED role - the probe will verify actual role
# and automatically adjust routing when topology changes.
#
# On failover/switchover:
#   - Dead servers are removed from rotation
#   - Role changes are detected via probe
#   - Writes route to detected primary
#   - Reads route to available replicas
#
# Per-server credentials override the defaults above.
# Format: name = host=... port=... dbname=... [user=...] [password=...] role=... weight=...
primary  = host=pgsql-01 port=5432 user=usr_test password=qaz123 dbname=testdb role=RW weight=100
replica1 = host=pgsql-02 port=5433 user=usr_test password=qaz123 dbname=testdb role=RO weight=100
replica2 = host=pgsql-03 port=5434 user=usr_test password=qaz123 dbname=testdb role=RO weight=100

# ============================================================================
# Example: PostgreSQL with Patroni
# ============================================================================
# When using Patroni, use the HTTP probe instead of SQL probe.
# Patroni exposes REST API on port 8008 (default).
#
# [worker_group.patroni_cluster]W
# name = patroni_cluster
# bind_port = 6432
# probe = patroni:8008
# probe_interval = 2s
# probe_timeout = 1s
# server_user = patroni_user
# server_password = env:PATRONI_DB_PASSWORD
#
# [worker_group.patroni_cluster.servers]
# # With role=auto, the Patroni probe will detect primary/replica status
# node1 = host=node1.db.local port=5432 dbname=myapp role=auto weight=100
# node2 = host=node2.db.local port=5432 dbname=myapp role=auto weight=100
# node3 = host=node3.db.local port=5432 dbname=myapp role=auto weight=100

# ============================================================================
# Example: MySQL with read_only detection
# ============================================================================
# MySQL uses @@read_only variable: 0=primary, 1=replica
#
# [worker_group.mysql_cluster]
# name = mysql_cluster
# bind_port = 3306
# probe = mysql
# probe_interval = 5s
#
# [worker_group.mysql_cluster.servers]
# master = host=mysql1.db.local port=3306 dbname=myapp role=RW weight=100
# slave1 = host=mysql2.db.local port=3306 dbname=myapp role=RO weight=100
# slave2 = host=mysql3.db.local port=3306 dbname=myapp role=RO weight=100

# ============================================================================
# Example: MariaDB MaxScale
# ============================================================================
# MaxScale has a REST API for monitoring
#
# [worker_group.maxscale]
# name = maxscale
# bind_port = 4006
# probe = maxscale:8989
#
# [worker_group.maxscale.servers]
# maxscale1 = host=maxscale1.local port=4006 role=auto weight=100

# ============================================================================
# Example: Custom probe script
# ============================================================================
# Use external script for complex detection logic
#
# [worker_group.custom]
# name = custom
# bind_port = 6432
# probe = exec:/usr/local/bin/db-health-check.sh
# probe_interval = 10s
#
# [worker_group.custom.servers]
# server1 = host=db1.local port=5432 role=auto weight=100

# Example: High-throughput analytics
# [worker_group.analytics]
# name = analytics
# bind_addr = 0.0.0.0
# bind_port = 6433
# num_workers = 8
# max_conns_per_worker = 5000
# client_idle_timeout = 30m
# client_connect_timeout = 30s
# min_pool_size = 2
# max_pool_size = 50
# probe = postgres
#
# [worker_group.analytics.servers]
# analytics = host=analytics.db.local port=5432 dbname=analytics role=RW weight=100

# ============================================================================
# Logging & Query Log
# ============================================================================
# KEEL supports a plugin-based logging architecture. Three built-in plugins
# are included: stdout, file, and syslog. External plugins can be loaded
# from shared libraries (.so / .dylib) at runtime.
#
# Log levels: error, warn, info, debug, trace, all/full, off/none
# Query log modes: none, all, read, write
#
[logging]
# Output plugin: stdout (default), file, syslog
# To use an external plugin shared library, set plugin_path instead.
plugin = stdout

# Path to an external log plugin shared library (.so / .dylib)
# When set, this overrides the built-in 'plugin' setting above.
# The library must export: keel_log_plugin_t* keel_log_plugin_create(void);
# plugin_path = /usr/local/lib/keel/keel_log_json.so

# Minimum log level
# Accepts: error, warn, info, debug, trace, all, full, off, none
log_level = info

# Query logging mode:
#   none  - No SQL query logging (default)
#   all   - Log every query
#   read  - Log only read queries (SELECT, SHOW, EXPLAIN)
#   write - Log only write/DDL queries (INSERT, UPDATE, DELETE, CREATE, etc.)
query_log_mode = none

# Include timestamp in each log line (default: true)
log_timestamps = true

# Include client origin IP/host and port (default: true)
log_source = true

# Include backend destination IP/host and port (default: true)
log_dest = true

# Include the username of the connected client (default: true)
log_username = true

# Include the database name (default: true)
log_database = true

# Include the parsed query tree in log output (default: false)
# When enabled, each logged query is fully parsed and the semantic tree
# (type, operation, flags, referenced tables and columns) is serialised
# alongside the SQL text. Useful for debugging routing decisions.
# Note: enabling this adds parsing overhead per logged query.
# log_query_tree = false

# Truncate logged SQL queries longer than this (0 = no limit)
# max_query_len = 4096

# Use ANSI colors in stdout output (default: true)
use_colors = true

# File plugin options (when plugin = file):
# log_file = /var/log/keel/queries.log

# Syslog plugin options (when plugin = syslog):
# syslog_ident = keel
# syslog_facility = daemon

# ============================================================================
# Statistics
# ============================================================================
# Controls the built-in statistics collector.
#
# level: off | basic | extended | system | trace | full
#   - off:      No statistics collected (zero overhead)
#   - basic:    L1 counters — sessions, bytes, errors, pool, loop (default)
#   - extended: L2 + latency histograms (query, backend, connect, session)
#   - system:   L3 + RSS/CPU/fd sampling per interval
#   - trace:    L4 + per-session tracing (future)
#   - full:     L5 + everything enabled (future)
#
# log_interval_ms: Periodic dump interval in milliseconds.
#   - 0 means no periodic dump (default). Use kill -USR1 <pid> for on-demand.
#   - e.g. 10000 = dump stats every 10 seconds to stdout.
#
[stats]
level = basic
# log_interval_ms = 10000

# ============================================================================
# Admin Console (PgBouncer-style)
# ============================================================================
# Speaks PostgreSQL wire protocol — connect with any PG client:
#   psql -h 127.0.0.1 -p 6433 -U admin -c "SHOW STATS"
#   psql -h 127.0.0.1 -p 6433 -U admin -c "SHOW HELP"
#
# Available commands:
#   SHOW STATS          Aggregated L1 counters
#   SHOW STATS_DETAIL   Per-worker breakdown
#   SHOW POOLS          Backend pool status
#   SHOW CLIENTS        Frontend session summary
#   SHOW CONFIG         Running configuration
#   SHOW LATENCY        Histogram percentiles (level >= extended)
#   SHOW SYSTEM         CPU/RSS/fd stats (level >= system)
#   SHOW VERSION        KEEL version
#   SHOW HELP           Command reference
#
[admin]
enabled = true
listen_addr = 127.0.0.1
listen_port = 6433
users = admin
# password = changeme              ; SCRAM-SHA-256 auth (omit for trust mode)

# ============================================================================
# Prometheus Metrics Exporter
# ============================================================================
# HTTP endpoint serving OpenMetrics text, scrapeable by Prometheus,
# Grafana Agent, Datadog Agent, Victoria Metrics, etc.
#
#   curl http://localhost:9101/metrics
#
# Add to prometheus.yml:
#   scrape_configs:
#     - job_name: 'keel'
#       static_configs:
#         - targets: ['localhost:9101']
#
[prometheus]
enabled = true
listen_addr = 0.0.0.0
port = 9101
# path = /metrics

# ============================================================================
# OpenTelemetry / OTLP push exporter (optional, build-time gated)
# ============================================================================
# When KEEL is built with -DKEEL_ENABLE_OTLP=ON, a background aggregator
# can periodically push a snapshot of the metric inventory documented in
# docs/METRICS_REFERENCE.md to any OTLP/HTTP-compatible collector
# (otel-collector, Tempo, Grafana Agent, Datadog Agent, etc.).
#
# The exporter runs on its own thread, never blocks the reactor, and
# isolates collector failures from the admin and serving paths
# (verified by tests/test_otlp_fault_injection.c). Self-stats are
# available at GET /api/observability/exporter.json.
#
# This section is ignored when KEEL is built without OTLP support.
#
# [observability]
# otlp_enabled = false
# otlp_endpoint_url = http://otel-collector:4318/v1/metrics
# otlp_bearer_token =                       ; optional Authorization: Bearer …
# otlp_timeout_ms = 5000                    ; per-HTTP-request timeout
# otlp_interval_ms = 5000                   ; snapshot+push cadence
# otlp_max_retries = 2                      ; retries per failed export
# otlp_queue_capacity = 4                   ; pending snapshots before drop
# otlp_encode_buf_bytes = 65536             ; protobuf encode scratch buffer

# ============================================================================
# Multi-Proxy HA / Cluster Mode
# ============================================================================
# Cluster mode enables multiple KEEL instances to form a peer group for
# high availability.  Peers exchange heartbeats, detect failures, and
# propagate server topology changes automatically.
#
# Admin commands:
#   SHOW CLUSTER          Peer table (status, latency, heartbeats)
#   SHOW CLUSTER STATS    Aggregated cluster statistics
#   ADD PEER host:port    Register a new peer at runtime
#   REMOVE PEER host:port Deregister a peer at runtime
#
# [cluster]
# enabled = false
# node_id =                         ; auto-generated from hostname:port if empty
# listen_addr = 0.0.0.0
# listen_port = 9100
# heartbeat_interval_ms = 1000      ; how often to send heartbeats (ms)
# heartbeat_timeout_ms = 5000       ; consider peer suspect after this (ms)
# failure_threshold = 3             ; consecutive failures before marking DOWN
# auto_sync = true                  ; detect config mismatches via gossip
# initial_peers = 10.0.0.2:9100,10.0.0.3:9100
