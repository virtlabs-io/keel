[logging]
plugin = stdout
log_level = info
query_log_mode = none
log_timestamps = true
log_source = true
log_dest = true
log_username = true
log_database = true
use_colors = true

# ============================================================================
# Runtime Security Hardening
# ============================================================================
[security]
# Drop root privileges after startup setup (listen/bind/rlimit) and before
# worker threads begin processing traffic.
privilege_drop = false
run_user = nobody
run_group = nogroup

# If true, startup fails when privilege drop cannot be applied.
require_privilege_drop = false

# Seccomp syscall policy:
#   off      - disabled
#   baseline - block dangerous syscalls (execve/ptrace/module load)
#   strict   - allowlist profile (may require tuning for custom environments)
seccomp = off

# If true, startup fails when seccomp cannot be applied.
require_seccomp = false

# Recommended for seccomp usage.
no_new_privs = true

# ============================================================================
# Statistics
# ============================================================================
[stats]
level = basic

# Hot-path instrumentation toggles (default ON).
# Use these to isolate overhead and root causes by category.
#   hotpath_all = on|off
#   hotpath_wait_pool = on|off
#   hotpath_wait_backend = on|off
#   hotpath_wait_backend_query_split = on|off
#   hotpath_deferred_send = on|off
#
# Example: keep coarse backend wait on, disable deep query split breakdown
# hotpath_all = off
# hotpath_wait_backend = on

# Runtime instrumentation category toggles (env vars, default ON):
#   KEEL_INSTR_ALL=0|1
#   KEEL_INSTR_CPU=0|1
#   KEEL_INSTR_MEMORY=0|1
#   KEEL_INSTR_FD=0|1
#   KEEL_INSTR_DISK=0|1
#   KEEL_INSTR_NETWORK=0|1
#
# Example: only CPU+FD system sampling
#   KEEL_INSTR_ALL=0 KEEL_INSTR_CPU=1 KEEL_INSTR_FD=1 ./keel -c ...
#
# Hot-path env equivalents (default ON):
#   KEEL_HOT_INSTR_ALL=0|1
#   KEEL_HOT_INSTR_WAIT_POOL=0|1
#   KEEL_HOT_INSTR_WAIT_BACKEND=0|1
#   KEEL_HOT_INSTR_WAIT_BACKEND_QUERY_SPLIT=0|1
#   KEEL_HOT_INSTR_DEFERRED_SEND=0|1

# ============================================================================
# Admin Console (PgBouncer-style)
# ============================================================================
[admin]
enabled = true
listen_addr = 127.0.0.1
listen_port = 6433
users = admin
# password = changeme              ; SCRAM-SHA-256 auth (omit for trust mode)

# ============================================================================
# Prometheus Metrics Exporter
# ============================================================================
[prometheus]
enabled = true
listen_addr = 0.0.0.0
port = 9101
