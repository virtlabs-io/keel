# KEEL Configuration File — Mixed MySQL and PostgreSQL Test Environments
# Database Connection Pooler Configuration

[keel]
log_level = 3

# ============================================================================
# PostgreSQL Async Replication (1 Primary + 2 Read Replicas)
# ============================================================================
[worker_group.test_pgsql]
name = test_pgsql
protocol = postgres
bind_addr = 0.0.0.0
bind_port = 7432
num_workers = 4
max_conns_per_worker = 5000
client_idle_timeout = 5m
client_connect_timeout = 30s

# Pool behavior
min_pool_size = 20
max_pool_size = 100

# Probe configuration (health checking and failover)
probe = postgres
probe_interval = 5s
probe_timeout = 3s
probe_retries = 3
failover_delay = 10s

server_user = usr_test
server_password = qaz123
# server_sslmode = prefer

# TLS (client -> Keel) using sample certs in etc/certs
tls_mode = require
tls_cert_file = /keel/etc/certs/server.pem
tls_key_file = /keel/etc/certs/server.key
tls_ca_file = /keel/etc/certs/ca-bundle.pem
tls_verify_peer = optional
ktls_enabled = 1
tls_handshake_timeout_ms = 10000
tls_read_timeout_ms = 30000

# Auto-generate TLS certificates on startup (0=off, 1=on).
# When enabled and no tls_cert_file/key_file are set, Keel generates a
# self-signed CA + server/client certs in tls_auto_dir.  Existing certs
# in that directory are reused (the CA key is preserved).
# tls_auto_generate = 1
# tls_auto_dir = /var/lib/keel/certs

# TLS (Keel -> backend) using sample client certs in etc/certs
# Keep as 'prefer' for mixed environments where backend TLS may not be enabled.
backend_tls_mode = prefer
backend_tls_cert_file = /keel/etc/certs/client.pem
backend_tls_key_file = /keel/etc/certs/client.key.pem
backend_tls_ca_file = /keel/etc/certs/ca-bundle.pem
backend_tls_verify_peer = optional
backend_ktls_enabled = 1
backend_tls_handshake_timeout_ms = 10000
backend_tls_read_timeout_ms = 30000

# Transaction tracking rewrites every COMMIT to
#   SELECT txid_current() AS _keel_txid; COMMIT;
# to record the XID before commit for replication-uncertainty resolution.
# Cost: one extra SQL statement per write transaction (~14% overhead on writes).
# Turn on when read-after-write coherency across replicas is required.
transaction_tracking = off

# Prepared statement pooling strategy
# off        — no PS interception; hard-pin backend on named Parse; zero tracking overhead.
#              Use when clients hold persistent connections and PS sharing isn't needed.
# virtualize — PS replay (default): backends stay poolable; replay Parse on new connections.
# tracking   — shadow + replay including simple-query PREPARE statements.
# pinning    — hard-pin backend on first PREPARE; simpler but forfeits pooling.
# anonymous  — JIT rewrite named Parse→unnamed; fully poolable, no server-side PS state.
prepared_statement = tracking

[worker_group.test_pgsql.servers]
# hostname 'postgres' resolves via Docker compose DNS inside the devenv container
# change to 127.0.0.1 when running keel directly on bare-metal / localhost PG
pgsql-01 = host=pgsql-01 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100
pgsql-02 = host=pgsql-02 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100
pgsql-03 = host=pgsql-03 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100

