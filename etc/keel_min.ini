[keel]
config_version = 2
log_level = info
shared_buffers = 512MB

[logging]
plugin = file
log_file = /tmp/keel-min.log
log_level = info

[worker_group.min]
name = min
bind_addr = *
bind_port = 7432
protocol = postgresql
default_database = keel_db
num_workers = 4
max_conns_per_worker = 500
client_idle_timeout = 5m
client_connect_timeout = 300s

# Pool behavior
# max_pool_size is the total keel→PostgreSQL connection budget across ALL workers.
# Each worker gets max_pool_size / num_workers backends (50/4 = 12 with defaults).
# For N concurrent VUs set max_pool_size >= N.  Bound by PostgreSQL max_connections.
min_pool_size = 20
max_pool_size = 50

# Frontend/client auth:
# "auth_type = file" in older wording maps to:
#   auth_method = scram-sha-256 + userlist_file = <path>
auth_method = scram-sha-256
userlist_file = etc/keel_min_userlist.txt

# Backend database credentials (Keel -> PostgreSQL)
server_user = keel_usr_db
server_password = keel_pwd_db

# Prepared statement pooling strategy
# off        — no PS interception; hard-pin backend on named Parse; zero tracking overhead.
#              Use when clients hold persistent connections and PS sharing isn't needed.
# virtualize — PS replay (default): backends stay poolable; replay Parse on new connections.
# tracking   — shadow + replay including simple-query PREPARE statements.
# pinning    — hard-pin backend on first PREPARE; simpler but forfeits pooling.
# anonymous  — JIT rewrite named Parse→unnamed; fully poolable, no server-side PS state.
# pool_wait_timeout: how long a session may queue waiting for a backend before
# receiving "backend connection pool timeout".  Defaults to connect_timeout_ms
# (client_connect_timeout) when unset.  Set explicitly to tune failure latency.
pool_wait_timeout = 60s

# prepared_statement = tracking
prepared_statement = virtualize

[worker_group.min.servers]
primary = host=127.0.0.1 port=6432 dbname=keel_db user=keel_usr_db password=keel_pwd_db role=RW weight=100
