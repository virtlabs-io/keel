[keel]
log_level = 3

[worker_group.test_pgsql]
# mode = pool
name = test_pgsql
protocol = postgres
bind_addr = 0.0.0.0
bind_port = 7432
num_workers = 4
max_conns_per_worker = 500
client_idle_timeout = 5m
client_connect_timeout = 30s

# Pool behavior
min_pool_size = 20
max_pool_size = 100

# Probe configuration (health checking and failover)
probe = postgres
probe_interval = 5s
probe_timeout = 3s
probe_retries = 3
failover_delay = 10s
probe_auth = scram
probe_user = usr_test
probe_password = qaz123

server_user = usr_test
server_password = qaz123
# server_sslmode = prefer

# Transaction tracking rewrites every COMMIT to
transaction_tracking = off

# After a write, reads are normally pinned to the primary for 100ms to ensure
# read-after-write consistency. For benchmarking against replicas, disable this.
sticky_primary_ttl_ms = 0

# Prepared statement pooling strategy
prepared_statement = virtualize

[worker_group.test_pgsql.servers]
pgsql-01 = host=pgsql-01 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100
pgsql-02 = host=pgsql-02 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100
pgsql-03 = host=pgsql-03 port=5432 user=usr_test password=qaz123 dbname=testdb role=auto weight=100

[logging]
plugin = stdout
log_level = info
query_log_mode = none
log_timestamps = true
log_source = true
log_dest = true
log_username = true
log_database = true
use_colors = true

[security]
privilege_drop = false
run_user = nobody
run_group = nogroup

require_privilege_drop = false

seccomp = off

require_seccomp = false

no_new_privs = true

[stats]
level = basic

[admin]
enabled = true
listen_addr = 127.0.0.1
listen_port = 16433
users = admin
# password = changeme

[prometheus]
enabled = true
listen_addr = 0.0.0.0
port = 19101
